services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dove
      POSTGRES_USER: dove
      POSTGRES_PASSWORD: dove
    ports:
      - "5432:5432"
    volumes:
      - dove-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - dove-redis-data:/data

volumes:
  dove-postgres-data:
  dove-redis-data:
